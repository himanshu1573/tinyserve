<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img"><rect width="880" height="420" fill="#fcfcfb"/><defs><marker id="head-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0b0b0b"/></marker></defs><text x="14.0" y="26.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">What tinyserve is: the path of one request</text><text x="14.0" y="42.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">An OpenAI-compatible server around a small model on the M1 GPU. Every box is one file in the repo.</text><rect x="24" y="70" width="150" height="104" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="40" cy="87" r="9" fill="#2a78d6"/><text x="40.0" y="90.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1</text><text x="54.0" y="91.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Client</text><text x="36.0" y="112.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">curl, or any</text><text x="36.0" y="126.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">OpenAI client</text><text x="36.0" y="140.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">POST /v1/completions</text><line x1="177" y1="122.0" x2="193" y2="122.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><rect x="196" y="70" width="150" height="104" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="212" cy="87" r="9" fill="#2a78d6"/><text x="212.0" y="90.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2</text><text x="226.0" y="91.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">HTTP server</text><text x="208.0" y="112.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">server/app.py</text><text x="208.0" y="126.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">checks the request,</text><text x="208.0" y="140.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">turns text into tokens</text><line x1="349" y1="122.0" x2="365" y2="122.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><rect x="368" y="70" width="150" height="104" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="384" cy="87" r="9" fill="#2a78d6"/><text x="384.0" y="90.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">3</text><text x="398.0" y="91.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Engine</text><text x="380.0" y="112.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">engine/engine.py</text><text x="380.0" y="126.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">one thread owns the GPU,</text><text x="380.0" y="140.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">one queue per request</text><line x1="521" y1="122.0" x2="537" y2="122.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><rect x="540" y="70" width="150" height="104" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="556" cy="87" r="9" fill="#2a78d6"/><text x="556.0" y="90.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">4</text><text x="570.0" y="91.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Scheduler</text><text x="552.0" y="112.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">engine/scheduler.py</text><text x="552.0" y="126.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">continuous batching:</text><text x="552.0" y="140.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">admit, prefill,</text><text x="552.0" y="154.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">decode, evict</text><line x1="693" y1="122.0" x2="709" y2="122.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><rect x="712" y="70" width="150" height="104" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="728" cy="87" r="9" fill="#2a78d6"/><text x="728.0" y="90.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">5</text><text x="742.0" y="91.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Runner</text><text x="724.0" y="112.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">engine/runner.py</text><text x="724.0" y="126.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">MLX on the M1 GPU</text><text x="724.0" y="140.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Qwen2.5-1.5B, 4-bit</text><line x1="615.0" y1="176" x2="615.0" y2="215" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><line x1="625.0" y1="216" x2="625.0" y2="177" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#head-light)"/><rect x="530" y="218" width="170" height="112" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="546" cy="235" r="9" fill="#2a78d6"/><text x="546.0" y="238.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">6</text><text x="560.0" y="239.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Block manager</text><text x="542.0" y="260.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">engine/block_manager.py</text><text x="542.0" y="274.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">KV cache in 16-token blocks:</text><text x="542.0" y="288.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">a free list, one block table</text><text x="542.0" y="302.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">per user, and shared blocks</text><text x="542.0" y="316.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">for shared prompts</text><text x="633.0" y="200.0" fill="#52514e" font-size="9.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">asks for blocks,</text><text x="633.0" y="212.0" fill="#52514e" font-size="9.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">gives them back</text><path d="M787.0,176 L787.0,360 L99.0,360 L99.0,182" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#head-light)"/><text x="779.0" y="382.0" fill="#2a78d6" font-size="10.5" font-weight="600" text-anchor="end" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">each new token goes straight back to the waiting client, one at a time, as a stream (server/sse.py)</text><text x="779.0" y="397.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="end" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the client sees words appear while the rest is still being made</text><rect x="196" y="218" width="210" height="96" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><circle cx="212" cy="235" r="9" fill="#eb6834"/><text x="212.0" y="238.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">7</text><text x="226.0" y="239.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Benchmark</text><text x="208.0" y="260.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">bench/harness.py</text><text x="208.0" y="274.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">fires 8 users at once and</text><text x="208.0" y="288.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">records first-token time,</text><text x="208.0" y="302.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">tok/s and peak RAM</text><line x1="236" y1="215" x2="236" y2="177" stroke="#eb6834" stroke-width="1.5" marker-end="url(#head-light)"/><text x="244.0" y="202.0" fill="#eb6834" font-size="9.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">acts as 8 clients</text></svg>
