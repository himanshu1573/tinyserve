<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img"><rect width="880" height="400" fill="#fcfcfb"/><defs><marker id="head-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0b0b0b"/></marker></defs><text x="14.0" y="26.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Why tinyserve exists</text><text x="14.0" y="42.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">A 1.5B model has to read about 1 GB of weights to make one token. That read is the slow part, not the math.</text><text x="14.0" y="78.0" fill="#eb6834" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">THE PROBLEM</text><text x="110.0" y="78.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">a plain server does one request at a time</text><rect x="14" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="39.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 1</text><rect x="72" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="97.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 2</text><rect x="130" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="155.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 3</text><rect x="188" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="213.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 4</text><rect x="246" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="271.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 5</text><rect x="304" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="329.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 6</text><rect x="362" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="387.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 7</text><rect x="420" y="94" width="50" height="30" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1"/><text x="445.0" y="113.0" fill="#ffffff" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 8</text><line x1="486" y1="109" x2="522" y2="109" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><rect x="530" y="86" width="116" height="46" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><text x="588.0" y="105.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the laptop</text><text x="588.0" y="119.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">serves one user</text><line x1="654" y1="109" x2="690" y2="109" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><text x="698.0" y="105.0" fill="#0b0b0b" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 1 gets an answer right away.</text><text x="698.0" y="119.0" fill="#0b0b0b" font-size="10.5" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 8 waits 28 s to see a word.</text><text x="14.0" y="148.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Everyone stands in line. Each one waits for all the users in front of them.</text><line x1="14" y1="166" x2="866" y2="166" stroke="#e7e6e2"/><text x="14.0" y="194.0" fill="#2a78d6" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">THE FIX</text><text x="80.0" y="194.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">a serving engine puts everyone into one batch and runs them together</text><rect x="14" y="210" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="39.0" y="224.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 1</text><rect x="14" y="234" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="39.0" y="248.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 2</text><rect x="14" y="258" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="39.0" y="272.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 3</text><rect x="14" y="282" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="39.0" y="296.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 4</text><rect x="70" y="210" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="95.0" y="224.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 5</text><rect x="70" y="234" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="95.0" y="248.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 6</text><rect x="70" y="258" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="95.0" y="272.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 7</text><rect x="70" y="282" width="50" height="20" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="95.0" y="296.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user 8</text><text x="70.0" y="320.0" fill="#52514e" font-size="10.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">one batch of 8</text><line x1="134" y1="256" x2="172" y2="256" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><rect x="180" y="230" width="130" height="52" rx="6" fill="#f2f1ed" stroke="#9a9992" stroke-width="1"/><text x="245.0" y="252.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the laptop serves</text><text x="245.0" y="266.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">all 8 in one pass</text><line x1="318" y1="256" x2="356" y2="256" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#head-light)"/><text x="366.0" y="244.0" fill="#0b0b0b" font-size="10.5" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">everyone sees a first word in 1.2 s, not 15 s.</text><text x="366.0" y="260.0" fill="#0b0b0b" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">each user gets about 5 tokens a second.</text><text x="366.0" y="276.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">new users join the batch mid-flight instead of waiting behind it.</text><text x="366.0" y="290.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">that is continuous batching. The paged KV cache is what lets</text><text x="366.0" y="304.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">8 users' memory fit in the 8 GB next to the model.</text><rect x="14" y="332" width="852" height="50" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="440.0" y="352.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">The question this project was built to answer:</text><text x="440.0" y="370.0" fill="#0b0b0b" font-size="12.5" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Can one 8 GB laptop serve eight people almost as fast as it serves one?</text></svg>
