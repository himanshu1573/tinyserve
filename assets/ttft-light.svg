<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img"><rect width="880" height="210" fill="#fcfcfb"/><text x="14.0" y="26.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Eight users, time to first token</text><text x="14.0" y="42.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">serial engine (one request at a time) vs continuous batching + paged KV</text><rect x="150" y="68" width="317.9" height="22" rx="4" fill="#eb6834"/><text x="140.0" y="83.5" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="end" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">median · serial</text><text x="475.9" y="83.5" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">14.9 s</text><rect x="150" y="96" width="25.6" height="22" rx="4" fill="#2a78d6"/><text x="140.0" y="111.5" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="end" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">median · tinyserve</text><text x="183.6" y="111.5" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1.2 s</text><rect x="150" y="134" width="601.6" height="22" rx="4" fill="#eb6834"/><text x="140.0" y="149.5" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="end" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">p95 · serial</text><text x="759.6" y="149.5" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">28.2 s</text><rect x="150" y="162" width="38.4" height="22" rx="4" fill="#2a78d6"/><text x="140.0" y="177.5" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="end" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">p95 · tinyserve</text><text x="196.4" y="177.5" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1.8 s</text><text x="150.0" y="194.0" fill="#52514e" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">12× faster at the median, 15× at p95 — aggregate throughput rose only 1.41×</text></svg>
