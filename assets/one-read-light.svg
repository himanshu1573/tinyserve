<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="880" height="250" fill="#fcfcfb"/>
  <text x="14" y="26" fill="#0b0b0b" font-size="13" font-weight="600">One weight read, one token. Or one weight read, eight tokens.</text>
  <text x="14" y="42" fill="#52514e" font-size="10.5">Decode is memory bound: the cost of a step is reading the weights. The idea behind batching is to share that read.</text>

  <!-- left: one user -->
  <text x="60" y="78" fill="#52514e" font-size="11" font-weight="600">ONE USER</text>
  <rect x="60" y="90" width="150" height="100" rx="6" fill="#f2f1ed" stroke="#9a9992"/>
  <text x="135" y="130" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle">read 1 GB</text>
  <text x="135" y="148" fill="#52514e" font-size="10.5" text-anchor="middle">of model weights</text>
  <text x="135" y="164" fill="#52514e" font-size="10.5" text-anchor="middle">~35 ms on an M1</text>
  <line x1="220" y1="140" x2="270" y2="140" stroke="#0b0b0b" stroke-width="1.5"/>
  <polygon points="270,135 280,140 270,145" fill="#0b0b0b"/>
  <rect x="290" y="126" width="60" height="28" rx="4" fill="#2a78d6"/>
  <text x="320" y="145" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">1 token</text>

  <!-- divider -->
  <line x1="410" y1="70" x2="410" y2="220" stroke="#e7e6e2"/>

  <!-- right: eight users -->
  <text x="440" y="78" fill="#52514e" font-size="11" font-weight="600">EIGHT USERS</text>
  <rect x="440" y="90" width="150" height="100" rx="6" fill="#f2f1ed" stroke="#9a9992"/>
  <text x="515" y="130" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="middle">read 1 GB</text>
  <text x="515" y="148" fill="#52514e" font-size="10.5" text-anchor="middle">of model weights</text>
  <text x="515" y="164" fill="#52514e" font-size="10.5" text-anchor="middle">the same read</text>
  <line x1="600" y1="140" x2="650" y2="140" stroke="#0b0b0b" stroke-width="1.5"/>
  <polygon points="650,135 660,140 650,145" fill="#0b0b0b"/>
  <g fill="#2a78d6">
    <rect x="670" y="94" width="60" height="18" rx="3"/>
    <rect x="670" y="116" width="60" height="18" rx="3"/>
    <rect x="670" y="138" width="60" height="18" rx="3"/>
    <rect x="670" y="160" width="60" height="18" rx="3"/>
    <rect x="740" y="94" width="60" height="18" rx="3"/>
    <rect x="740" y="116" width="60" height="18" rx="3"/>
    <rect x="740" y="138" width="60" height="18" rx="3"/>
    <rect x="740" y="160" width="60" height="18" rx="3"/>
  </g>
  <text x="735" y="196" fill="#0b0b0b" font-size="11" font-weight="600" text-anchor="middle">8 tokens</text>

  <text x="14" y="236" fill="#52514e" font-size="10.5">If this were the whole story, eight users would each get almost the speed of one. The rest of the post is about where it holds and where it does not.</text>
</svg>
