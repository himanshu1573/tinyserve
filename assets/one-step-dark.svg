<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img"><rect width="880" height="340" fill="#1a1a19"/><defs><marker id="head-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#ffffff"/></marker></defs><text x="14.0" y="26.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">What happens in one scheduler step</text><text x="14.0" y="42.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">The engine runs this loop again and again. Each loop gives every running user one new token.</text><rect x="24" y="66" width="250" height="118" rx="6" fill="#242422" stroke="#7d7c75" stroke-width="1"/><circle cx="40" cy="83" r="9" fill="#3987e5"/><text x="40.0" y="86.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1</text><text x="54.0" y="87.0" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Admit</text><text x="36.0" y="108.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Take waiting requests while there is</text><text x="36.0" y="122.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">room in the batch and free KV blocks.</text><text x="36.0" y="136.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Run the whole prompt in one pass</text><text x="36.0" y="150.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">(prefill) and send the first token.</text><text x="36.0" y="164.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">New users join mid-flight. Nobody</text><text x="36.0" y="178.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">waits for the batch to finish.</text><line x1="278" y1="125.0" x2="310" y2="125.0" stroke="#ffffff" stroke-width="1.5" marker-end="url(#head-dark)"/><rect x="314" y="66" width="250" height="118" rx="6" fill="#242422" stroke="#7d7c75" stroke-width="1"/><circle cx="330" cy="83" r="9" fill="#3987e5"/><text x="330.0" y="86.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2</text><text x="344.0" y="87.0" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Decode</text><text x="326.0" y="108.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">One forward pass for all running</text><text x="326.0" y="122.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">users together. Each one gets one</text><text x="326.0" y="136.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">token. The 1 GB weight read is</text><text x="326.0" y="150.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">paid once and shared by all of them.</text><text x="326.0" y="164.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">This is where batching pays off.</text><line x1="568" y1="125.0" x2="600" y2="125.0" stroke="#ffffff" stroke-width="1.5" marker-end="url(#head-dark)"/><rect x="604" y="66" width="250" height="118" rx="6" fill="#242422" stroke="#7d7c75" stroke-width="1"/><circle cx="620" cy="83" r="9" fill="#3987e5"/><text x="620.0" y="86.5" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">3</text><text x="634.0" y="87.0" fill="#ffffff" font-size="12" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Evict</text><text x="616.0" y="108.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Users who hit a stop token or their</text><text x="616.0" y="122.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">max_tokens are done. Their KV blocks</text><text x="616.0" y="136.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">go back to the free list, so the next</text><text x="616.0" y="150.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">step has room to admit more.</text><path d="M729.0,186 L729.0,202 L149.0,202 L149.0,192" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#head-dark)"/><text x="440.0" y="196.0" fill="#c3c2b7" font-size="10" font-weight="400" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">next step</text><text x="14.0" y="236.0" fill="#c3c2b7" font-size="11" font-weight="600" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">THE KV CACHE, AS BLOCKS</text><text x="190.0" y="236.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">every user's memory is a list of 16-token blocks, handed out from one pool</text><rect x="14" y="250" width="40" height="28" rx="4" fill="#3987e5" stroke="#3987e5" stroke-width="1"/><text x="34.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">sys</text><rect x="60" y="250" width="40" height="28" rx="4" fill="#3987e5" stroke="#3987e5" stroke-width="1"/><text x="80.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">sys</text><rect x="106" y="250" width="40" height="28" rx="4" fill="#d95926" stroke="#d95926" stroke-width="1"/><text x="126.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">A</text><rect x="152" y="250" width="40" height="28" rx="4" fill="#d95926" stroke="#d95926" stroke-width="1"/><text x="172.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">A</text><rect x="198" y="250" width="40" height="28" rx="4" fill="#d95926" stroke="#d95926" stroke-width="1"/><text x="218.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">A</text><rect x="244" y="250" width="40" height="28" rx="4" fill="#3d9a6b" stroke="#3d9a6b" stroke-width="1"/><text x="264.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">B</text><rect x="290" y="250" width="40" height="28" rx="4" fill="#3d9a6b" stroke="#3d9a6b" stroke-width="1"/><text x="310.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">B</text><rect x="336" y="250" width="40" height="28" rx="4" fill="#8a63d2" stroke="#8a63d2" stroke-width="1"/><text x="356.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">C</text><rect x="382" y="250" width="40" height="28" rx="4" fill="#8a63d2" stroke="#8a63d2" stroke-width="1"/><text x="402.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">C</text><rect x="428" y="250" width="40" height="28" rx="4" fill="#8a63d2" stroke="#8a63d2" stroke-width="1"/><text x="448.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">C</text><rect x="474" y="250" width="40" height="28" rx="4" fill="#8a63d2" stroke="#8a63d2" stroke-width="1"/><text x="494.0" y="268.0" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">C</text><rect x="520" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="540.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="566" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="586.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="612" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="632.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="658" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="678.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="704" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="724.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="750" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="770.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="796" y="250" width="40" height="28" rx="4" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="816.0" y="268.0" fill="#c3c2b7" font-size="10" font-weight="600" text-anchor="middle" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"></text><rect x="14" y="289" width="12" height="12" rx="2" fill="#3987e5" stroke="#3987e5" stroke-width="1"/><text x="32.0" y="299.0" fill="#c3c2b7" font-size="10" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">shared system prompt: one copy, 3 users point at it</text><rect x="339.59999999999997" y="289" width="12" height="12" rx="2" fill="#d95926" stroke="#d95926" stroke-width="1"/><text x="357.6" y="299.0" fill="#c3c2b7" font-size="10" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user A</text><rect x="413.19999999999993" y="289" width="12" height="12" rx="2" fill="#3d9a6b" stroke="#3d9a6b" stroke-width="1"/><text x="431.2" y="299.0" fill="#c3c2b7" font-size="10" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user B</text><rect x="486.79999999999995" y="289" width="12" height="12" rx="2" fill="#8a63d2" stroke="#8a63d2" stroke-width="1"/><text x="504.8" y="299.0" fill="#c3c2b7" font-size="10" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">user C</text><rect x="560.4" y="289" width="12" height="12" rx="2" fill="#242422" stroke="#7d7c75" stroke-width="1"/><text x="578.4" y="299.0" fill="#c3c2b7" font-size="10" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">free, ready for the next user</text><text x="14.0" y="322.0" fill="#c3c2b7" font-size="10.5" font-weight="400" text-anchor="start" opacity="1.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">No big fixed slab per user, so memory is not wasted on space a short answer never uses. That is what "paged" means here.</text></svg>
